name: Build + Web Flasher
'on':
  push:
    branches:
    - main
    paths:
    - src/**
    - include/**
    - platformio.ini
    - web/**
    - tools/**
    - firmware/page-turner/**
    - .github/workflows/build.yml
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test BLE page turner controls
      working-directory: firmware/page-turner
      run: |
        cc -std=c11 -Wall -Wextra -Werror -I main main/controls.c tests/test_controls.c -o "$RUNNER_TEMP/page-turner-test"
        "$RUNNER_TEMP/page-turner-test"
        cc -std=c11 -Wall -Wextra -Werror -I main main/hosts.c tests/test_hosts.c -o "$RUNNER_TEMP/page-hosts-test"
        "$RUNNER_TEMP/page-hosts-test"
    - name: Install build tools
      run: pip install --upgrade platformio pillow
    - name: Generate RGB565 screensaver
      run: python tools/generate_screensaver.py
    - name: Generate v0.9 firmware source
      run: python tools/generate_v09.py
    - name: Build StickS3 firmware
      run: pio run -e m5stack-sticks3
    - name: Build BLE page turner firmware
      uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
      with:
        esp_idf_version: v5.5.2
        target: esp32s3
        path: firmware/page-turner
    - name: Create browser-flashable image
      run: |
        mkdir -p dist
        python ~/.platformio/packages/tool-esptoolpy/esptool.py \
          --chip esp32s3 merge_bin \
          -o dist/pocket-nexus.bin \
          --flash_mode dio \
          --flash_freq 80m \
          --flash_size 8MB \
          0x0000 .pio/build/m5stack-sticks3/bootloader.bin \
          0x8000 .pio/build/m5stack-sticks3/partitions.bin \
          0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
          0x10000 .pio/build/m5stack-sticks3/firmware.bin
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: pocket-nexus-firmware
        path: dist/pocket-nexus.bin
        retention-days: 1
    - name: Stage and validate both web installers
      run: |
        python tools/prepare_web_installer.py \
          --boot-app0 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
    - name: Upload GitHub Pages artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
        retention-days: 1
    timeout-minutes: 25
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
